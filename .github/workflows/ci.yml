name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore Cashflow.sln
      - run: dotnet build Cashflow.sln --no-restore
      - run: dotnet test Cashflow.sln --no-build --verbosity normal
