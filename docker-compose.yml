services:
  postgres-lancamentos:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_LANCAMENTOS}
    ports:
      - "5432:5432"
    volumes:
      - postgres_lancamentos_data:/var/lib/postgresql/data
      - ./docker/postgres/init-lancamentos.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-consolidado:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_CONSOLIDADO}
    ports:
      - "5433:5432"
    volumes:
      - postgres_consolidado_data:/var/lib/postgresql/data
      - ./docker/postgres/init-consolidado.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  consolidado-api:
    build:
      context: .
      dockerfile: src/Consolidado.Api/Dockerfile
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__ConsolidadoDb: Host=postgres-consolidado;Port=5432;Database=${POSTGRES_DB_CONSOLIDADO};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      Kafka__Topic: ${KAFKA_TOPIC}
      Kafka__DlqTopic: ${KAFKA_DLQ_TOPIC}
      Kafka__ConsumerGroup: ${KAFKA_CONSUMER_GROUP}
      Cors__AllowedOrigin: ${CORS_ALLOWED_ORIGIN}
    depends_on:
      postgres-consolidado:
        condition: service_healthy
      kafka:
        condition: service_healthy

  lancamentos-api:
    build:
      context: .
      dockerfile: src/Lancamentos.Api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__LancamentosDb: Host=postgres-lancamentos;Port=5432;Database=${POSTGRES_DB_LANCAMENTOS};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      Kafka__Topic: ${KAFKA_TOPIC}
      Outbox__PollIntervalSeconds: 2
      Cors__AllowedOrigin: ${CORS_ALLOWED_ORIGIN}
    depends_on:
      postgres-lancamentos:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - lancamentos-api
      - consolidado-api

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      kafka:
        condition: service_healthy

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      postgres-lancamentos:
        condition: service_healthy
      postgres-consolidado:
        condition: service_healthy

volumes:
  postgres_lancamentos_data:
  postgres_consolidado_data:
